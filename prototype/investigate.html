<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Разбор алерта ALR-2026-0417, Redstring</title>
  <meta name="description" content="Демо-разбор алерта на синтетических данных: ход агента, граф переводов, вершина схемы и гипотезы со сносками на переводы." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <svg class="visually-hidden" aria-hidden="true" focusable="false">
    <symbol id="i-triangle-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
    <symbol id="i-circle-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></symbol>
    <symbol id="i-circle-minus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M8 12h8" /></symbol>
    <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
    <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="m4.9 4.9 14.2 14.2" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></symbol>
    <symbol id="i-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></symbol>
    <symbol id="i-square" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6" /></symbol>
  </svg>

  <noscript>
    <style>.app, .skip { display: none; }</style>
    <div class="noscript">
      <p>Экрану расследования нужен JavaScript. <a href="index.html">Вернуться на главную</a></p>
      <p lang="en">The investigation screen needs JavaScript. <a href="en.html">Back to the home page</a></p>
    </div>
  </noscript>

  <a class="skip" href="#hypotheses" data-i18n="skip">К гипотезам</a>

  <div class="app">
    <header class="bar">
      <a class="wordmark" id="home-link" href="index.html" data-i18n-label="homeLabel" aria-label="Redstring, на главную">Redstring</a>
      <span class="id bar-alert">ALR-2026-0417</span>
      <p class="run-status" id="run-status"><svg class="icon" aria-hidden="true"><use href="#i-clock" /></svg><span class="run-text"><span id="run-live" aria-live="polite"></span><span id="run-detail" aria-hidden="true"></span></span></p>
      <div class="bar-actions">
        <button class="btn" type="button" id="btn-stop"><svg class="icon" aria-hidden="true"><use href="#i-square" /></svg><span data-i18n="stop">Остановить</span></button>
        <button class="btn" type="button" id="btn-restart"><svg class="icon" aria-hidden="true"><use href="#i-rotate-ccw" /></svg><span data-i18n="restart">Перезапустить</span></button>
        <nav class="lang" data-i18n-label="langLabel" aria-label="Язык">
          <a href="?lang=ru" hreflang="ru" lang="ru" data-lang="ru">RU</a>
          <a href="?lang=en" hreflang="en" lang="en" data-lang="en">EN</a>
        </nav>
      </div>
    </header>

    <main class="workspace" id="main">
      <section class="col col-left" aria-labelledby="h-alert">
        <div class="block">
          <h2 class="col-h" id="h-alert" data-i18n="alertH">Алерт</h2>
          <dl class="pairs" id="alert"></dl>
        </div>
        <div class="notice" id="notice" role="status" hidden></div>
        <div class="block block-steps">
          <h2 class="col-h" id="h-steps" data-i18n="stepsH">Ход агента</h2>
          <ol class="steps" id="steps"></ol>
          <p class="visually-hidden" id="announcer" aria-live="polite"></p>
        </div>
      </section>

      <section class="col col-center" aria-labelledby="h-graph">
        <div class="graph-head">
          <div class="graph-title">
            <h2 class="col-h" id="h-graph" data-i18n="graphH">Граф переводов</h2>
            <p class="graph-stats" id="graph-stats"></p>
          </div>
          <div class="toolbar">
            <button class="icon-btn" type="button" id="btn-clear" data-tip=""><svg class="icon" aria-hidden="true"><use href="#i-x" /></svg></button>
            <button class="icon-btn" type="button" id="btn-context" aria-pressed="false" data-tip=""><svg class="icon" aria-hidden="true"><use href="#i-eye-off" /></svg></button>
            <span class="toolbar-gap" aria-hidden="true"></span>
            <button class="icon-btn" type="button" id="btn-zoom-out" data-tip=""><svg class="icon" aria-hidden="true"><use href="#i-minus" /></svg></button>
            <button class="icon-btn" type="button" id="btn-zoom-in" data-tip=""><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg></button>
            <button class="icon-btn" type="button" id="btn-fit" data-tip=""><svg class="icon" aria-hidden="true"><use href="#i-maximize" /></svg></button>
          </div>
        </div>
        <p class="selection" id="selection"></p>
        <div class="graph">
          <div class="graph-canvas" id="graph" tabindex="0" role="group" aria-describedby="graph-hint">
            <svg class="graph-svg" id="graph-svg" aria-hidden="true"></svg>
            <div class="graph-labels" id="graph-labels" aria-hidden="true"></div>
            <p class="graph-empty" id="graph-empty" hidden></p>
          </div>
          <p class="visually-hidden" id="graph-hint"></p>
          <div class="panel" id="panel" role="dialog" aria-labelledby="panel-title" hidden></div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="transfers">
          <h2 class="col-h" id="h-transfers" data-i18n="transfersH">Переводы</h2>
          <div class="table-wrap">
            <table class="ledger" id="transfers" aria-labelledby="h-transfers"></table>
          </div>
        </div>
      </section>

      <section class="col col-right" aria-labelledby="h-apex">
        <div class="block">
          <h2 class="col-h" id="h-apex" data-i18n="apexH">Вершина схемы</h2>
          <div id="apex"></div>
        </div>
        <div class="block">
          <h2 class="col-h" id="h-hyps"><span data-i18n="hypsH">Гипотезы</span> <span class="count num" id="hyp-count"></span></h2>
          <ol class="hyps" id="hypotheses" tabindex="-1"></ol>
          <div class="closing" id="closing" hidden></div>
        </div>
      </section>
    </main>
  </div>

  <dialog class="dialog" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <h2 class="col-h" id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button class="btn" type="button" id="confirm-cancel" autofocus></button>
      <button class="btn" type="button" id="confirm-ok"></button>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
